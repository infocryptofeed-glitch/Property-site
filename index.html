<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" id="brandMark">P</div>
      <div class="brand-name" id="siteName">Loading...</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="social-row" id="socialRow"></div>
      <button class="theme-toggle" id="themeToggle" title="Toggle dark/light" aria-label="Toggle dark/light"></button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="shell hero-inner">
    <div class="hero-text">
      <h1 id="heroTitle">Find your next property</h1>
      <p id="heroSubtitle">Browse verified listings, straight from the dealer.</p>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by title, location, or keyword...">
        <button id="searchBtn">Search</button>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--brass)" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="var(--brass)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <circle cx="270" cy="60" r="70" fill="url(#skyGrad)"/>
        <g class="float-slow">
          <rect x="30" y="120" width="60" height="110" rx="4" fill="#3F7CAC" stroke="var(--line)"/>
          <rect x="40" y="135" width="14" height="14" fill="#FFD37A" opacity="0.85"/>
          <rect x="66" y="135" width="14" height="14" fill="#FFD37A" opacity="0.5"/>
          <rect x="40" y="160" width="14" height="14" fill="#FFD37A" opacity="0.5"/>
          <rect x="66" y="160" width="14" height="14" fill="#FFD37A" opacity="0.85"/>
        </g>
        <g class="float-med">
          <rect x="100" y="80" width="80" height="150" rx="4" fill="#C9713F" stroke="var(--line)"/>
          <rect x="112" y="98" width="16" height="16" fill="#FFE29A" opacity="0.7"/>
          <rect x="140" y="98" width="16" height="16" fill="#FFE29A" opacity="0.85"/>
          <rect x="112" y="126" width="16" height="16" fill="#FFE29A" opacity="0.5"/>
          <rect x="140" y="126" width="16" height="16" fill="#FFE29A" opacity="0.7"/>
          <rect x="112" y="154" width="16" height="16" fill="#FFE29A" opacity="0.85"/>
          <rect x="140" y="154" width="16" height="16" fill="#FFE29A" opacity="0.5"/>
        </g>
        <g class="float-fast">
          <rect x="195" y="140" width="55" height="90" rx="4" fill="#6FA582" stroke="var(--line)"/>
          <path d="M195 140 L222 110 L250 140 Z" fill="#D9A441"/>
          <rect x="205" y="160" width="12" height="12" fill="#2E3B33"/>
          <rect x="228" y="160" width="12" height="12" fill="#2E3B33"/>
          <rect x="216" y="200" width="18" height="30" fill="#2E3B33"/>
        </g>
        <g class="float-med">
          <rect x="260" y="165" width="45" height="65" rx="4" fill="#7C6FA0" stroke="var(--line)"/>
          <rect x="270" y="180" width="10" height="10" fill="#F2E9C9" opacity="0.7"/>
          <rect x="288" y="180" width="10" height="10" fill="#F2E9C9" opacity="0.7"/>
        </g>
        <line x1="10" y1="230" x2="330" y2="230" stroke="var(--line)" stroke-width="1"/>
      </svg>
    </div>
  </div>
</section>

<nav class="category-row" id="categoryRow">
  <!-- category pills injected here -->
</nav>

<main class="grid" id="listingGrid">
  <!-- listing cards injected here -->
</main>

<div class="empty-state" id="emptyState" style="display:none;">No listings found. Try a different search or category.</div>

<footer>
  <div id="contactLine">Contact the dealer for more details.</div>
  <div style="margin-top:6px;opacity:0.7;">&copy; <span id="copyrightYear"></span> <span id="footerSiteName">This site</span>. All rights reserved.</div>
</footer>

<!-- Profile badge -->
<div class="profile-card" id="profileCard">
  <img id="profileCardImg" src="" alt="" style="width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px;">
  <h3 id="profileCardName">Dealer</h3>
  <p id="profileCardBio">—</p>
  <a class="btn primary" id="profileCardContact" href="#" style="display:inline-block;text-decoration:none;text-align:center;">Contact</a>
</div>
<div class="profile-badge" id="profileBadge">
  <img id="profileBadgeImg" src="" alt="Dealer">
</div>

<!-- Listing detail modal -->
<div class="modal-backdrop" id="modalBackdrop" style="display:none;">
  <div class="modal" id="modalContent"></div>
</div>

<div id="lightbox" class="lightbox-backdrop" style="display:none;">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <div id="lightboxContent" class="lightbox-content"></div>
</div>

<div id="toastHost"></div>

<script type="module" src="app-public.js"></script>
</body>
</html>
